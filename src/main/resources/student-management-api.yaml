openapi: 3.0.3
info:
  title: Student Management API
  description: REST API for managing students, courses, and student course enrollments.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api

tags:
  - name: Students
    description: Student CRUD and course enrollment operations
  - name: Courses
    description: Course CRUD operations

paths:
  /students:
    get:
      tags: [Students]
      summary: Get all students
      operationId: getAllStudents
      responses:
        '200':
          description: List of students
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Student'

    post:
      tags: [Students]
      summary: Create a student
      operationId: createStudent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentRequest'
      responses:
        '201':
          description: Student succesfully created
        '400':
          $ref: '#/components/responses/BadRequest'

  /students/{studentId}:
    parameters:
      - $ref: '#/components/parameters/StudentId'

    get:
      tags: [Students]
      summary: Get a student by ID
      operationId: getStudent
      responses:
        '200':
          description: Student found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Students]
      summary: Update a student
      operationId: updateStudent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentRequest'
      responses:
        '204':
          description: Student successfully updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Students]
      summary: Delete a student
      operationId: deleteStudent
      responses:
        '204':
          description: Student deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /students/{studentId}/courses:
    parameters:
      - $ref: '#/components/parameters/StudentId'

    post:
      tags: [Students]
      summary: Enroll a student in one or multiple courses
      operationId: enrollCourses
      requestBody:
        required: true
        content:
           application/json:
             schema:
               type: array
               minItems: 1
               items:
                 type: integer
                 format: int64
      responses:
        '204':
          description: Student successfully enrolled in the course(s)
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Students]
      summary: Remove one or more course enrollments from a student
      operationId: unenrollCourses
      requestBody:
              required: true
              content:
                 application/json:
                   schema:
                     type: array
                     minItems: 1
                     items:
                       type: integer
                       format: int64
      responses:
        '200':
          description: Courses have successfully been unenrolled from a student
        '404':
          $ref: '#/components/responses/NotFound'

  /courses:
    get:
      tags: [Courses]
      summary: Get all courses
      operationId: getAllCourses
      responses:
        '200':
          description: List of courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Course'

    post:
      tags: [Courses]
      summary: Create a course
      operationId: createCourse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseRequest'
      responses:
        '201':
          description: Course created
        '400':
          $ref: '#/components/responses/BadRequest'

  /courses/{courseId}:
    parameters:
      - $ref: '#/components/parameters/CourseId'

    get:
      tags: [Courses]
      summary: Get a course by ID
      operationId: getCourse
      responses:
        '200':
          description: Course found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Courses]
      summary: Update a course
      operationId: updateCourse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseRequest'
      responses:
        '200':
          description: Course updated successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Courses]
      summary: Delete a course
      operationId: deleteCourse
      responses:
        '204':
          description: Course deleted
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    StudentId:
      name: studentId
      in: path
      required: true
      description: Student ID
      schema:
        type: integer
        format: int64
        minimum: 1

    CourseId:
      name: courseId
      in: path
      required: true
      description: Course ID
      schema:
        type: integer
        format: int64
        minimum: 1

  schemas:
    Student:
      type: object
      required: [id, firstName, lastName, email, courses]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: Smith
        email:
          type: string
          format: email
          example: john.smith@example.com
        courses:
          type: array
          description: list of courses which the student is enrolled.
          items:
            $ref: '#/components/schemas/Course'

    StudentRequest:
      type: object
      required: [firstName, lastName, email]
      properties:
        id:
          type: integer
          format: int64
        firstName:
          type: string
          minLength: 1
          example: John
        lastName:
          type: string
          minLength: 1
          example: Smith
        email:
          type: string
          format: email
          example: john.smith@example.com
        courseIds:
          type: array
          items:
            type: integer
            format: int64
          example: [1, 2]

    Course:
      type: object
      required: [id, name, description]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          minLength: 1
          example: Angular
        description:
          type: string
          example: Angular fundamentals

    CourseRequest:
      type: object
      required: [name, description]
      properties:
        name:
          type: string
          minLength: 1
          example: Angular
        description:
          type: string
          example: Angular fundamentals

    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          example: 404
        message:
          type: string
          example: Student not found

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
